; Survival Wiki firmware
; Targets:
;   - survival-wiki-35: Hosyond / LCDWiki 3.5" ESP32-32E (E32R35T) [320x480 ST7796]
;   - survival-wiki-28: Sunton 2.8" ESP32-2432S028R CYD [240x320 ILI9341]
;
; Build + flash:  pio run -e survival-wiki-35 -t upload
;                 pio run -e survival-wiki-28 -t upload
; Serial monitor: pio device monitor

[platformio]
default_envs = survival-wiki-35

[common]
platform = espressif32 @ 6.9.0          ; Arduino-ESP32 core 2.0.17
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv   ; 3 MB app, no OTA
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bodmer/TJpg_Decoder @ ^1.1.0

; Default backward-compatible 3.5" target
[env:survival-wiki]
extends = common
build_flags =
    -DUSER_SETUP_LOADED=1
    -DBOARD_CYD_35=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTOUCH_CS=33
    -DUSE_HSPI_PORT=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000

; Explicit 3.5" Hosyond / LCDWiki E32R35T target
[env:survival-wiki-35]
extends = common
build_flags =
    -DUSER_SETUP_LOADED=1
    -DBOARD_CYD_35=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTOUCH_CS=33
    -DUSE_HSPI_PORT=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000

; 2.8" Sunton ESP32-2432S028R CYD target
