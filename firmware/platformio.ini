; Survival Wiki firmware - Hosyond / LCDWiki 3.5" ESP32-32E (E32R35T) board
; Build + flash:  pio run -t upload      Serial monitor:  pio device monitor

[env:survival-wiki]
platform = espressif32 @ 6.9.0          ; Arduino-ESP32 core 2.0.17
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv   ; 3 MB app, no OTA
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bodmer/TJpg_Decoder @ ^1.1.0
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTOUCH_CS=33
    -DUSE_HSPI_PORT=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000
    ; If red and blue look swapped on your screen, add:  -DTFT_RGB_ORDER=TFT_RGB
